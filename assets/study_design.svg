<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150" role="img" aria-labelledby="title desc">
<title id="title">Developmental sampling design</title><desc id="desc">Six developmental stages, shown at equal schematic spacing, across seven tissues.</desc>
<rect width="920" height="150" rx="12" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="26" font-size="13" fill="#294B60" font-weight="700" text-anchor="start" letter-spacing="1.3">DEVELOPMENTAL SAMPLING</text>
<text x="892" y="26" font-size="13" fill="#526573" font-weight="600" text-anchor="end" letter-spacing="0">7 tissues  /  6 stages</text>
<rect x="28" y="39" width="280" height="30" rx="5" fill="#EFF3F8" stroke="none" stroke-width="1"/>
<rect x="318" y="39" width="574" height="30" rx="5" fill="#EDF5F3" stroke="none" stroke-width="1"/>
<text x="168" y="59" font-size="15" fill="#49658A" font-weight="600" text-anchor="middle" letter-spacing="0">Embryonic development</text>
<text x="605" y="59" font-size="15" fill="#376F69" font-weight="600" text-anchor="middle" letter-spacing="0">Postnatal development</text>
<path d="M98 92 H822" fill="none" stroke="#A4B3BE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="98.0" cy="92" r="6" fill="#647FA4" stroke="#FFFFFF" stroke-width="2"/>
<text x="98.0" y="118" font-size="16" fill="#253746" font-weight="700" text-anchor="middle" letter-spacing="0">E55</text>
<circle cx="242.8" cy="92" r="6" fill="#647FA4" stroke="#FFFFFF" stroke-width="2"/>
<text x="242.8" y="118" font-size="16" fill="#253746" font-weight="700" text-anchor="middle" letter-spacing="0">E90</text>
<circle cx="387.6" cy="92" r="6" fill="#4E8781" stroke="#FFFFFF" stroke-width="2"/>
<text x="387.6" y="118" font-size="16" fill="#253746" font-weight="700" text-anchor="middle" letter-spacing="0">P0</text>
<circle cx="532.4000000000001" cy="92" r="6" fill="#4E8781" stroke="#FFFFFF" stroke-width="2"/>
<text x="532.4000000000001" y="118" font-size="16" fill="#253746" font-weight="700" text-anchor="middle" letter-spacing="0">P30</text>
<circle cx="677.2" cy="92" r="6" fill="#4E8781" stroke="#FFFFFF" stroke-width="2"/>
