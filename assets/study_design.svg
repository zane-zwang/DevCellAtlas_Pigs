<circle cx="822.0" cy="92" r="6" fill="#4E8781" stroke="#FFFFFF" stroke-width="2"/>
<text x="822.0" y="118" font-size="16" fill="#253746" font-weight="700" text-anchor="middle" letter-spacing="0">P180</text>
<text x="892" y="139" font-size="11" fill="#526573" font-weight="400" text-anchor="end" letter-spacing="0">Schematic spacing; not to scale</text>
</g></svg>